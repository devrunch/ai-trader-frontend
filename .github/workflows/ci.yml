name: CI

on:
  workflow_dispatch:   # a "Run workflow" button for deploying without a code change
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # The production box has 2 GB of RAM and `next build` needs most of it,
  # which is why every deploy used to be a full outage. It is built here and
  # shipped as a tarball of Next's standalone output instead.
  bundle:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    # ARM and Node 20, both matching the box: the standalone output carries a
    # platform-specific SWC binary and runs on whatever Node is installed there.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: write          # publishes the bundle as a release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The public origin is inlined into the bundle at build time, so a
      # hostname change needs a rebuild here, not a restart there.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://3.7.76.174.sslip.io
          NEXT_TELEMETRY_DISABLED: '1'

      # `next build` leaves static assets and public/ outside the standalone
      # tree on purpose; the server 404s on every asset without them.
      - name: Pack the standalone server
        run: |
          echo '${{ github.sha }}' > .next/standalone/COMMIT
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar czf frontend.tar.gz -C .next/standalone .

      # A release asset, not an artifact: the box's deploy key is restricted
      # to a forced command, so CI cannot copy files onto it. The repo is
      # public, so the box fetches this with plain curl and no credentials.
      - name: Publish the rolling bundle release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete bundle --yes --cleanup-tag || true
          gh release create bundle frontend.tar.gz \
            --title 'Frontend bundle' --notes 'built from ${{ github.sha }}'

  # Deploy only after this repo's own tests pass, and only for the real branch.
  # deploy.sh on the box pulls all three repos, so whichever one moved, the
  # whole stack ends up on the latest commit of each.
  deploy:
    needs: [test, bundle]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One deploy at a time per repo. Across repos, the box itself serialises
    # them: the deploy key's forced command runs under flock.
    concurrency:
      group: deploy-production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          # The key is restricted on the box to running deploy.sh, so the
          # command sent here is ignored — any command triggers the deploy.
          ssh -i key -o StrictHostKeyChecking=accept-new -o BatchMode=yes ubuntu@3.7.76.174 deploy
          rm -f key

      - name: Check the site answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://3.7.76.174.sslip.io/api/health || true)
            [ "$code" = "200" ] && echo "health OK" && exit 0
            echo "attempt $i: $code"; sleep 10
          done
          echo "site did not return 200 after the deploy"; exit 1
