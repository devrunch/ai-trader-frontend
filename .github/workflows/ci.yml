name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # The production box has 2 GB of RAM and `next build` needs most of it, which
  # is why every deploy used to be a full outage. The image is built here and
  # pulled there instead.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # ARM, because the production box is Graviton (t4g). An x86 image pulls
    # there with "no matching manifest for linux/arm64". Free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # The public origin is inlined into the bundle at build time.
          build-args: NEXT_PUBLIC_API_URL=https://3.7.76.174.sslip.io
          tags: |
            ghcr.io/devrunch/ai-trader-frontend:latest
            ghcr.io/devrunch/ai-trader-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy only after this repo's own tests pass, and only for the real branch.
  # deploy.sh on the box pulls all three repos, so whichever one moved, the
  # whole stack ends up on the latest commit of each.
  deploy:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One deploy at a time per repo. Across repos, the box itself serialises
    # them: the deploy key's forced command runs under flock.
    concurrency:
      group: deploy-production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          # The key is restricted on the box to running deploy.sh, so the
          # command sent here is ignored — any command triggers the deploy.
          ssh -i key -o StrictHostKeyChecking=accept-new -o BatchMode=yes ubuntu@3.7.76.174 deploy
          rm -f key

      - name: Check the site answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://3.7.76.174.sslip.io/api/health || true)
            [ "$code" = "200" ] && echo "health OK" && exit 0
            echo "attempt $i: $code"; sleep 10
          done
          echo "site did not return 200 after the deploy"; exit 1
